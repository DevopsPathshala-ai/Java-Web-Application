name: Java CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    env:
      APP_NAME: webapp
      DEPLOY_DIR: /opt/webapp
      SPRING_PROFILES_ACTIVE: prod

    steps:

    # ---------------------------
    # Checkout Code
    # ---------------------------
    - name: Checkout source code
      uses: actions/checkout@v4

    # ---------------------------
    # Setup JDK 21
    # ---------------------------
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    # ---------------------------
    # Cache Maven Dependencies
    # ---------------------------
    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2

    # ---------------------------
    # Build
    # ---------------------------
    - name: Build with Maven
      run: mvn clean package -DskipTests

    # ---------------------------
    # Test
    # ---------------------------
    - name: Run Unit Tests
      run: mvn test

    # ---------------------------
    # Code Quality
    # ---------------------------
    - name: Code Quality Verification
      run: mvn verify

    # ---------------------------
    # Upload Artifact
    # ---------------------------
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: webapp-jar
        path: target/${{ env.APP_NAME }}.jar

    # ---------------------------
    # Deploy to EC2
    # ---------------------------
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sudo mkdir -p ${{ env.DEPLOY_DIR }}
          sudo chown $USER:$USER ${{ env.DEPLOY_DIR }}

    - name: Copy JAR to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "target/${{ env.APP_NAME }}.jar"
        target: "${{ env.DEPLOY_DIR }}"

    - name: Copy Deployment Scripts
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "scripts/*"
        target: "${{ env.DEPLOY_DIR }}"

    - name: Restart Application
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ${{ env.DEPLOY_DIR }}

          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env
          echo "DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }}" >> .env
          echo "DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}" >> .env
          echo "SPRING_PROFILES_ACTIVE=${{ env.SPRING_PROFILES_ACTIVE }}" >> .env

          chmod +x start.sh stop.sh
          ./stop.sh || true
          ./start.sh

    # ---------------------------
    # Health Check
    # ---------------------------
    - name: Health Check
      run: |
        sleep 15
        curl -f http://${{ secrets.EC2_HOST }}:8080/api/health

    # ---------------------------
    # Notify Success
    # ---------------------------
    - name: Send Success Email
      if: success()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: SUCCESS - ${{ github.workflow }}
        body: Build and deployment successful.
        to: team@example.com
        from: CI/CD Pipeline

    # ---------------------------
    # Notify Failure
    # ---------------------------
    - name: Send Failure Email
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: FAILURE - ${{ github.workflow }}
        body: Build failed. Check logs.
        to: team@example.com
        from: CI/CD Pipeline
